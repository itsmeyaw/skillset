name: Version

on:
  push:
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch
      pull-requests: write # open the Version Packages PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No publish script: publishing is triggered by a version tag in release.yml
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
