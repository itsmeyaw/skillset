name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the trusted publisher registered on npmjs.com
    environment: npm
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only commits already on main may be published
      - name: Verify tag
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No registry-url: it writes an _authToken placeholder that blocks OIDC
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm >= 11.5.1 required for trusted publishing
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run release
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
